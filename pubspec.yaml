name: psf_publinfo
description: "Aplicación multiplataforma para mostrar boletines informativos y publicidad de comercios y negocios emergentes"

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter  
  cupertino_icons: ^2.0.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  cloud_functions: ^7.0.1
  firebase_storage: ^14.0.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:  
  uses-material-design: true  
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
